services:
    db:
        image: postgres:16
        container_name: mvgs-db
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 5
        volumes:
            - postgres_data:/var/lib/postgresql/data
        env_file:
            - .env

    django:
        build: .
        container_name: mvgs-django
        restart: unless-stopped
        command: >
            sh -c "python manage.py migrate &&
            python manage.py collectstatic --noinput &&
            gunicorn my_videogames_shelf_back.wsgi:application --bind 0.0.0.0:8000 --workers 3"
        working_dir: /app/my_videogames_shelf_back
        depends_on:
            db:
                condition: service_healthy
        env_file:
            - .env
        volumes:
            - static_volume:/app/staticfiles

    nginx:
        build:
            context: .
            dockerfile: frontend/Dockerfile
        container_name: mvgs-nginx
        restart: unless-stopped
        depends_on:
            - django
        ports:
            - "8080:80"
        volumes:
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
            - static_volume:/static

    pgadmin:
        image: dpage/pgadmin4
        container_name: mvgs-pgadmin
        restart: always
        ports:
            - "8081:80"
        env_file:
            - .env
        depends_on:
            - db

volumes:
    postgres_data:
    static_volume:
