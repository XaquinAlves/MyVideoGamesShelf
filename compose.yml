services:
    db:
        image: postgres:16
        container_name: mvgs-db
        restart: unless-stopped
        volumes:
            - postgres_data:/var/lib/postgresql/data
        env_file:
            - .env

    django:
        build: .
        container_name: mvgs-django
        restart: unless-stopped
        command: sh -c "python manage.py migrate &&
            python manage.py collectstatic --noinput &&
            gunicorn my_videogames_shelf_back.wsgi:application --bind 0.0.0.0:8000 --workers 3"
        working_dir: /app/my_videogames_shelf_back
        volumes:
            - static_volume:/app/staticfiles
            - media_volume:/app/media
        depends_on:
            - db
        env_file:
            - .env

    pgadmin:
        image: dpage/pgadmin4
        container_name: mvgs-pgadmin
        restart: always
        ports:
            - "8081:80"
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
        depends_on:
            - db
        env_file:
            - .env

    nginx:
        image: nginx:stable
        container_name: mvgs-nginx
        restart: unless-stopped
        depends_on:
            - django
        ports:
            - "8080:80"
        volumes:
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
            - static_volume:/static
            - media_volume:/media

volumes:
    postgres_data:
    static_volume:
    media_volume:
